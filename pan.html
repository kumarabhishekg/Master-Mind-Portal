<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PAN Card Application - Mastermind Portal</title>

    <style>
        body { margin: 0px; padding: 0px; background-color: #f1f1f1; font-family: Arial, sans-serif; user-select: none; }
        shortcut { position: sticky; top: 0px; color: red; padding: 5px 10px; font-size: 20px; font-style: italic; background-color: lightgray; display: flex; flex-wrap: wrap; justify-content: space-around; align-items: center; width: 100%; box-sizing: border-box; z-index: 1000; }
        .Mygov, .g20 { height: 15px; width: auto; }
        
        .form-container { max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        .form-container h2.main-title { text-align: center; color: #007bff; margin-bottom: 5px; font-size: 28px; }
        .price-tag { text-align: center; font-size: 18px; font-weight: bold; color: #d9534f; margin-bottom: 20px; }
        
        .contact-warning { text-align: center; background-color: #ffcccc; color: #d32f2f; padding: 15px; border-radius: 8px; border: 2px solid #d32f2f; margin-bottom: 25px; font-weight: bold; font-size: 16px; text-transform: uppercase; }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 16px; background: #f8fafc; user-select: text; }
        
        .section-title { background: #f8f9fa; padding: 10px; border-left: 5px solid #007bff; margin-top: 30px; margin-bottom: 15px; font-weight: bold; color: #333; }
        
        .submit-btn { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s ease; margin-top: 10px; }
        .submit-btn:hover { background-color: #0056b3; }

        .active-user-box { background-color: #e8f4fd; border: 1px dashed #007bff; padding: 12px; border-radius: 8px; margin-bottom: 25px; text-align: center; font-size: 15px; color: #007bff; }
        .active-user-box span { font-weight: bold; color: #333; }
    </style>
</head>
<body oncontextmenu="return false;">
    
<shortcut>
    <a href="HOME.html" style="color: red; text-decoration: none;">MASTERMIND</a>
    <a href="HOME.html">HOME</a> 
    <a href="">SERVICES</a>
    <a href="">SBI</a>  
    <a href="">About</a>
    <a href="#" id="authLink" style="text-align: right;">LOGOUT</a>

    <!-- GOOGLE TRANSLATE BUTTON -->
    <div id="google_translate_element" style="margin-left: 15px; display: inline-block;"></div>
</shortcut>

<div class="form-container">
    <div class="contact-warning">
        Agar koi proof na ho to contact karein no. 7037505945
    </div>

    <h2 class="main-title">PAN Card Application</h2>
    <div class="price-tag">💵 Service Fee / Price: <b>₹200</b></div>
    
    <div class="active-user-box">
        👤 Application will be sent by:<br>
        <span id="displaySenderName">Loading...</span>
    </div>

    <form id="panForm" onsubmit="return submitPanForm(event)">
        
        <div class="section-title">Personal Details</div>
        <div class="input-group">
            <label>Applicant Name</label>
            <input type="text" id="applicantName" placeholder="Enter Full Name" required>
        </div>
        <div class="input-group">
            <label>Mobile Number (10 Digits)</label>
            <input type="tel" id="mobile" placeholder="Enter mobile number" maxlength="10" required>
        </div>

        <div class="section-title">Aadhaar Card Upload (Images or PDFs)</div>
        <div class="input-group">
            <label>Upload Aadhaar Card (Front Side)</label>
            <input type="file" id="aadhaarFront" accept="image/*,.pdf" required>
        </div>
        <div class="input-group">
            <label>Upload Aadhaar Card (Back Side)</label>
            <input type="file" id="aadhaarBack" accept="image/*,.pdf" required>
        </div>

        <div class="section-title">Address Proof (Koi ek chunein)</div>
        <div class="input-group">
            <label>Select Proof Document Type</label>
            <select id="proofType" required>
                <option value="">-- Choose Document --</option>
                <option value="High School Marksheet">High School Marksheet</option>
                <option value="Voter Card">Voter Card</option>
                <option value="Driving License">Driving License</option>
                <option value="Birth Certificate">Birth Certificate</option>
            </select>
        </div>
        <div class="input-group">
            <label>Upload Address Proof Photo / Document</label>
            <input type="file" id="addressProofFile" accept="image/*,.pdf" required>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">Submit PAN Application (₹200)</button>
    </form>
</div>

<!-- GOOGLE TRANSLATE SCRIPT -->
<script type="text/javascript">
    function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
            new google.translate.TranslateElement({
                pageLanguage: 'en',
                includedLanguages: 'hi,en',
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script>
    // --- F12 & Inspect Element Security Protection ---
    document.addEventListener('keydown', function(e) {
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
            e.preventDefault();
            return false;
        }
        if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
            e.preventDefault();
            return false;
        }
    });

    let currentSenderMobile = "";
    let currentSenderName = "";

    window.onload = async function() {
        const authLink = document.getElementById("authLink");
        try {
            const response = await fetch("/api/me", {credentials: "same-origin"});
            if (!response.ok) throw new Error("Login required");
            const result = await response.json();
            currentSenderMobile = result.user.mobile;
            currentSenderName = result.user.name;
            const nameSpan = document.getElementById("displaySenderName");
            if (nameSpan) nameSpan.innerText = `${currentSenderName} (${currentSenderMobile})`;
            if (authLink) {
                authLink.innerText = "LOGOUT"; authLink.href = "#";
                authLink.onclick = async function(e) { e.preventDefault(); await fetch("/api/logout", {method:"POST", credentials:"same-origin"}); window.location.href="HOME.html"; };
            }
        } catch (error) {
            alert("Form bharne ke liye pehle Login karna zaroori hai!");
            window.location.href = "login.html";
        }
    };

    // Server upload helper function
    async function uploadFileToServer(file, customerName, serviceName, mobile, desc) {
        if (!file) return "";
        let formData = new FormData();
        formData.append("file", file);
        formData.append("customer_name", customerName || "Customer");
        formData.append("service_name", serviceName || "PAN Card");
        formData.append("mobile", mobile || "Not Provided");
        formData.append("description", desc || "");

        try {
            let response = await fetch("/api/upload", {
                method: "POST",
                body: formData
            });
            let result = await response.json();
            if (result.status === "success") {
                return result.file_url;
            } else {
                throw new Error(result.message || "Upload failed");
            }
        } catch (err) {
            console.error("Cloud upload failed:", err);
            throw err;
        }
    }

    async function submitPanForm(event) {
        event.preventDefault();
        let submitBtn = document.getElementById("submitBtn");
        submitBtn.innerText = "Uploading Files to Server... Please wait";
        submitBtn.disabled = true;

        var mobile = document.getElementById("mobile").value;
        var applicantName = document.getElementById("applicantName").value;
        var proofType = document.getElementById("proofType").value;

        if (!/^[0-9]{10}$/.test(mobile)) {
            alert("Kripya valid 10-digit mobile number daalein!");
            submitBtn.innerText = "Submit PAN Application (₹200)";
            submitBtn.disabled = false;
            return false;
        }

        let senderInfo = currentSenderName + " (" + currentSenderMobile + ")";

        try {
            let frontFile = document.getElementById('aadhaarFront').files[0];
            let backFile = document.getElementById('aadhaarBack').files[0];
            let proofFile = document.getElementById('addressProofFile').files[0];

            // Uploading all 3 documents to FastAPI server
            let frontUrl = await uploadFileToServer(frontFile, applicantName, "PAN Card", mobile, "Aadhaar Front");
            let backUrl = await uploadFileToServer(backFile, applicantName, "PAN Card", mobile, "Aadhaar Back");
            let proofUrl = await uploadFileToServer(proofFile, applicantName, "PAN Card", mobile, `Address Proof: ${proofType}`);

            let fileNamesList = [
                "Upload Aadhaar Card (Front Side)",
                "Upload Aadhaar Card (Back Side)",
                `Address Proof (${proofType})`
            ];

            let applicationData = {
                serviceName: "PAN Card (Fee: ₹200)",
                sender: senderInfo,
                aadhaarName: applicantName,
                mobile: mobile,
                description: `Proof Type: ${proofType} | PAN Card Application (Fee: ₹200)`, 
                frontImg: frontUrl, 
                backImg: backUrl,  
                extraDocs: [proofUrl], 
                fileNamesList: fileNamesList,
                date: new Date().toLocaleDateString(),
                status: "Pending"
            };

            const saveResponse = await fetch("/api/applications", {
                method: "POST", credentials: "same-origin",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(applicationData)
            });
            if (!saveResponse.ok) { const err = await saveResponse.json(); throw new Error(err.detail || "Application save failed"); }

            alert("PAN Card Application Successfully Submitted (Fee: ₹200)!");
            window.location.href = "H login.html";
        } catch (error) {
            console.error(error);
            alert("Error: Form submit karne mein samasya aayi!");
            submitBtn.innerText = "Submit PAN Application (₹200)";
            submitBtn.disabled = false;
        }
        return false;
    }
</script>

</body>
</html>
