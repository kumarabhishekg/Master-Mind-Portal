<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mastermind Portal - Document Upload</title>
    
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .upload-card { background: white; max-width: 500px; width: 100%; padding: 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center; margin: 15px; }
        
        .brand-logo { font-size: 24px; font-weight: 800; color: #1e3c72; font-style: italic; letter-spacing: 1px; margin-bottom: 5px; }
        .brand-sub { font-size: 13px; color: #64748b; margin-bottom: 25px; }

        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #333; font-size: 14px; }
        .input-group input[type="text"] { width: 100%; padding: 12px 15px; border: 1.5px solid #cbd5e1; border-radius: 10px; font-size: 15px; outline: none; background: #f8fafc; }
        .input-group input:focus { border-color: #1e3c72; background: #fff; }

        .radio-group { display: flex; gap: 20px; background: #f1f5f9; padding: 12px 15px; border-radius: 10px; border: 1.5px solid #cbd5e1; }
        .radio-option { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #334155; cursor: pointer; font-size: 14px; }
        .radio-option input { accent-color: #1e3c72; width: 18px; height: 18px; cursor: pointer; }

        .file-box { border: 2px dashed #3b82f6; background: #eff6ff; padding: 25px; border-radius: 12px; cursor: pointer; position: relative; transition: 0.3s; }
        .file-box:hover { background: #dbeafe; }
        .file-box input { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 5; }
        .file-icon { font-size: 32px; margin-bottom: 8px; display: block; }
        .file-text { font-weight: bold; color: #1e3c72; font-size: 15px; }
        .file-hint { font-size: 12px; color: #64748b; margin-top: 5px; }
        #selectedFileName { margin-top: 10px; font-size: 13px; font-weight: bold; color: #16a34a; word-break: break-all; }

        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.3); }
        .submit-btn:hover { transform: translateY(-2px); }
        .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

        .progress-wrapper { display: none; margin-top: 20px; text-align: left; background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid #cbd5e1; }
        .progress-bar-container { width: 100%; background: #e2e8f0; border-radius: 20px; height: 12px; overflow: hidden; margin-top: 8px; margin-bottom: 10px; }
        .progress-bar { width: 0%; height: 100%; background: linear-gradient(90deg, #3b82f6, #16a34a); border-radius: 20px; transition: width 0.2s ease; }
        .progress-info { display: flex; justify-content: space-between; font-size: 12px; font-weight: bold; color: #475569; }
    </style>
</head>
<body>

<div class="upload-card">
    <div class="brand-logo">MASTERMIND PORTAL</div>
    <div class="brand-sub">Digital Services & Quick Document Hub</div>

    <form id="customerUploadForm" onsubmit="handleUpload(event)">
        <div class="input-group">
            <label>Aapka Naam (Optional)</label>
            <input type="text" id="custName" placeholder="Apna naam likhein (ya khali chhod dein)">
        </div>

        <div class="input-group">
            <label>Print Type (Kisme print chahiye?) *</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" name="printType" value="Color" required> 🎨 Color
                </label>
                <label class="radio-option">
                    <input type="radio" name="printType" value="Black & White" required> ⬛ Black & White
                </label>
            </div>
        </div>

        <div class="input-group">
            <label>Document Upload (Server Storage Supported) *</label>
            <div class="file-box">
                <span class="file-icon">📁</span>
                <div class="file-text">Click to Choose Files or Drag Here</div>
                <div class="file-hint">Supports: PDF, JPG, PNG, Word, Excel, etc.</div>
                <input type="file" id="custFile" required multiple onchange="showFileDetails(this)">
            </div>
            <div id="selectedFileName"></div>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">🚀 Send to Python Server</button>

        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-info">
                <span id="statusText">Uploading to Server...</span>
                <span id="percentText">0%</span>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-info" style="font-size: 11px; color: #64748b; font-weight: normal;">
                <span id="timeText">Time: 0s</span>
                <span id="sizeText">0 MB / 0 MB</span>
            </div>
        </div>
    </form>
</div>

<script>
    function showFileDetails(input) {
        const fileNameDiv = document.getElementById("selectedFileName");
        if (input.files && input.files.length > 0) {
            let totalSize = 0;
            let names = Array.from(input.files).map(f => {
                totalSize += f.size;
                return f.name;
            });
            let sizeMB = (totalSize / (1024 * 1024)).toFixed(2);
            fileNameDiv.innerText = `✅ Selected (${input.files.length} file): ${names.join(", ")} [Total Size: ${sizeMB} MB]`;
        } else {
            fileNameDiv.innerText = "";
        }
    }

    function uploadSingleFileWithProgress(file, customerName, printType, onProgress) {
        return new Promise((resolve, reject) => {
            let xhr = new XMLHttpRequest();
            let formData = new FormData();
            formData.append("file", file);
            const mobile = localStorage.getItem("loggedInUserMobile") || "Not Provided";
            formData.append("customer_name", customerName);
            formData.append("service_name", `Quick Upload (${printType})`);
            formData.append("mobile", mobile);
            formData.append("description", `Print Type: ${printType}`);

            xhr.upload.onprogress = function(event) {
                if (event.lengthComputable) {
                    onProgress(event.loaded);
                }
            };

            xhr.onload = function() {
                if (xhr.status >= 200 && xhr.status < 300) {
                    try {
                        let response = JSON.parse(xhr.responseText);
                        resolve(response);
                    } catch (e) {
                        reject(e);
                    }
                } else {
                    reject(new Error("Server error: " + xhr.status));
                }
            };

            xhr.onerror = function() {
                reject(new Error("Network error"));
            };

            xhr.open("POST", "/api/upload", true);
            xhr.send(formData);
        });
    }

    async function handleUpload(event) {
        event.preventDefault();
        
        let name = document.getElementById("custName").value.trim() || "Anonymous Customer";
        let printTypeRadio = document.querySelector('input[name="printType"]:checked');
        if (!printTypeRadio) {
            alert("Kripya Print Type select karein!");
            return;
        }
        let printType = printTypeRadio.value;
        let fileInput = document.getElementById("custFile");
        let files = fileInput.files;
        
        if (files.length === 0) {
            alert("Kripya kam se kam ek file select karein!");
            return;
        }

        let submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;

        let progressWrapper = document.getElementById("progressWrapper");
        if (progressWrapper) progressWrapper.style.display = "block";

        let progressBar = document.getElementById("progressBar");
        let percentText = document.getElementById("percentText");
        let statusText = document.getElementById("statusText");
        let timeText = document.getElementById("timeText");
        let sizeText = document.getElementById("sizeText");

        let startTime = Date.now();
        let totalBytes = Array.from(files).reduce((acc, f) => acc + f.size, 0);
        let totalSizeMB = (totalBytes / (1024 * 1024)).toFixed(2);
        let completedFilesBytes = 0;

        let fileMetaList = [];

        for (let i = 0; i < files.length; i++) {
            let file = files[i];
            if (statusText) statusText.innerText = `Uploading (${i + 1}/${files.length}): ${file.name}`;

            try {
                let result = await uploadSingleFileWithProgress(file, name, printType, (currentFileLoadedBytes) => {
                    let currentTotalUploaded = completedFilesBytes + currentFileLoadedBytes;
                    let progress = Math.min(99, Math.round((currentTotalUploaded / totalBytes) * 100));
                    let elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
                    let uploadedMB = (currentTotalUploaded / (1024 * 1024)).toFixed(2);

                    if (progressBar) progressBar.style.width = progress + "%";
                    if (percentText) percentText.innerText = progress + "%";
                    if (timeText) timeText.innerText = `Time: ${elapsedTime}s`;
                    if (sizeText) sizeText.innerText = `${uploadedMB} MB / ${totalSizeMB} MB`;
                });

                if (result && result.status === "success") {
                    fileMetaList.push({
                        name: file.name,
                        url: result.file_url,
                        unique_id: result.unique_id
                    });
                }
            } catch (err) {
                console.error("Error uploading " + file.name + ":", err);
            }

            completedFilesBytes += file.size;
        }

        if (progressBar) progressBar.style.width = "100%";
        if (percentText) percentText.innerText = "100%";
        if (statusText) statusText.innerText = "Upload Complete!";

        if (fileMetaList.length > 0) {
            let fileNames = fileMetaList.map(f => f.name).join(", ");
            let applicationData = {
                serviceName: `Quick Upload (${printType})`,
                sender: `${name} (Server Storage)`,
                aadhaarName: name,
                mobile: localStorage.getItem("loggedInUserMobile") || "Not Provided",
                description: `Print Type: ${printType} | Files: ${fileNames}`,
                frontImg: fileMetaList[0] ? fileMetaList[0].url : null,
                backImg: fileMetaList[1] ? fileMetaList[1].url : null,
                extraDocs: fileMetaList.slice(2).map(f => f.url),
                date: new Date().toLocaleDateString(),
                status: "Pending"
            };

            try {
                const savedRecord = await savePortalRecord("instantPrintQueue", applicationData);
                applicationData.id = savedRecord.id;
                let existing = JSON.parse(localStorage.getItem("instantPrintQueue")) || [];
                existing.push(applicationData);
                localStorage.setItem("instantPrintQueue", JSON.stringify(existing));
            } catch (e) {
                localStorage.removeItem("instantPrintQueue");
                localStorage.setItem("instantPrintQueue", JSON.stringify([applicationData]));
                alert(`File upload ho gayi, lekin server queue save nahi hui: ${e.message}. Admin dashboard isi browser se kholkar local request sync karein.`);
                submitBtn.disabled = false;
                return;
            }

            alert(`✅ ${fileMetaList.length} files successfully Python Server par upload ho gayi hain!`)
            
            let isLoggedIn = localStorage.getItem("isLoggedIn");
            if (isLoggedIn === "true") {
                window.location.href = "H login.html";
            } else {
                window.location.href = "HOME.html";
            }
        } else {
            alert("❌ Server par file upload nahi ho paayi. Kripya apna internet ya server check karein.");
            submitBtn.disabled = false;
        }
    }
</script>

<script src="portal-api.js"></script>
</body>
</html>
