<script>
    function showFileDetails(input) {
        const fileNameDiv = document.getElementById("selectedFileName");
        if (input.files && input.files.length > 0) {
            let totalSize = 0;
            let names = Array.from(input.files).map(f => {
                totalSize += f.size;
                return f.name;
            });
            let sizeMB = (totalSize / (1024 * 1024)).toFixed(2);
            fileNameDiv.innerText = `✅ Selected (${input.files.length} file): ${names.join(", ")} [Total Size: ${sizeMB} MB]`;
        } else {
            fileNameDiv.innerText = "";
        }
    }

    async function handleUpload(event) {
        event.preventDefault();
        
        let name = document.getElementById("custName").value.trim() || "Anonymous Customer";
        let printTypeRadio = document.querySelector('input[name="printType"]:checked');
        if (!printTypeRadio) {
            alert("Kripya Print Type select karein!");
            return;
        }
        let printType = printTypeRadio.value;
        let fileInput = document.getElementById("custFile");
        
        if (fileInput.files.length === 0) {
            alert("Kripya kam se kam ek file select karein!");
            return;
        }

        document.getElementById("submitBtn").disabled = true;
        document.getElementById("progressWrapper").style.display = "block";

        let progressBar = document.getElementById("progressBar");
        let percentText = document.getElementById("percentText");
        let statusText = document.getElementById("statusText");

        progressBar.style.width = "20%";
        percentText.innerText = "20%";
        statusText.innerText = "Uploading files to server...";

        let fileMetaList = [];

        // Ek-ek karke saari select ki gayi files ko server par bhejenge
        for (let i = 0; i < fileInput.files.length; i++) {
            let file = fileInput.files[i];
            let formData = new FormData();
            formData.append("file", file);
            formData.append("customer_name", name);
            formData.append("service_name", `Quick Upload (${printType})`);
            formData.append("mobile", "Not Provided");
            formData.append("description", `Print Type: ${printType}`);

            try {
                let response = await fetch("/api/upload", {
                    method: "POST",
                    body: formData
                });
                let result = await response.json();
                if (result.status === "success") {
                    fileMetaList.push({
                        name: file.name,
                        url: result.file_url,
                        unique_id: result.unique_id
                    });
                }
            } catch (err) {
                console.error("Upload failed for file:", file.name, err);
            }

            let progressPercent = Math.floor(((i + 1) / fileInput.files.length) * 80) + 20;
            progressBar.style.width = progressPercent + "%";
            percentText.innerText = progressPercent + "%";
        }

        progressBar.style.width = "100%";
        percentText.innerText = "100%";
        statusText.innerText = "Upload Complete!";

        if (fileMetaList.length > 0) {
            let fileNames = fileMetaList.map(f => f.name).join(", ");
            let applicationData = {
                serviceName: `Quick Upload (${printType})`,
                sender: `${name} (Instant Print)`,
                aadhaarName: name,
                mobile: "Not Provided",
                description: `Print Type: ${printType} | Files: ${fileNames}`,
                frontImg: fileMetaList[0] ? fileMetaList[0].url : null,
                backImg: fileMetaList[1] ? fileMetaList[1].url : null,
                extraDocs: fileMetaList.slice(2).map(f => f.url),
                date: new Date().toLocaleDateString(),
                status: "Pending"
            };

            try {
                let existing = JSON.parse(localStorage.getItem("instantPrintQueue")) || [];
                existing.push(applicationData);
                localStorage.setItem("instantPrintQueue", JSON.stringify(existing));
            } catch (e) {
                console.error("Local storage error:", e);
            }
        }

        setTimeout(() => {
            alert("✅ Saari files successfully upload ho gayi hain aur admin queue mein bhej di gayi hain!");
            let isLoggedIn = localStorage.getItem("isLoggedIn");
            if (isLoggedIn === "true") {
                window.location.href = "H login.html";
            } else {
                window.location.href = "HOME.html";
            }
        }, 500);
    }
</script>
