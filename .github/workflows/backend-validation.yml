name: Backend validation

on:
  push:
    branches:
      - security/server-side-migration
  pull_request:
    branches:
      - main
      - security/server-side-migration

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q main.py database.py
      - name: Import FastAPI application
        run: python -c "import main; assert main.app is not None; print('FastAPI app import OK')"
