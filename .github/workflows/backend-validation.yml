name: Backend validation

on:
  push:
    branches:
      - security/server-side-migration
  pull_request:
    branches:
      - main
      - security/server-side-migration

env:
  DATABASE_URL: sqlite:///./ci_test.db
  SESSION_SECRET: ci-test-session-secret
  UPLOADS_ENABLED: "false"
  REQUIRE_EXTERNAL_DATABASE: "false"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q main.py database.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for page in Path('.').glob('*.html'):
              source = page.read_text(encoding='utf-8')
              scripts = re.findall(r'<script[^>]*>(.*?)</script>', source, re.I | re.S)
              for script in scripts:
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as tmp:
                      tmp.write(script)
                      tmp.flush()
                      subprocess.run(['node', '--check', tmp.name], check=True)
          print('Inline JavaScript syntax OK')
          PY
      - name: Import FastAPI application
        run: python -c "import main; assert main.app is not None; print('FastAPI app import OK')"
      - name: Run authentication and access-control tests
        run: pytest -q
