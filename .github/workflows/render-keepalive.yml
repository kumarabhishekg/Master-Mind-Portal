name: Render Free Service Keep-Alive

on:
  schedule:
    - cron: "3,10,18,25,33,40,48,55 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Send a GET request to the Render site
        run: |
          curl --fail --silent --show-error --location \
            --max-time 180 \
            --output /dev/null \
            --write-out "HTTP %{http_code} after %{time_total}s\n" \
            https://master-mind-portal.onrender.com/
