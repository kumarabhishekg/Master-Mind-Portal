services:
  - type: web
    name: master-mind-portal
    runtime: python
    plan: free
    region: singapore
    branch: security/server-side-migration
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REQUIRE_EXTERNAL_DATABASE
        value: "true"
      - key: UPLOADS_ENABLED
        value: "false"
      - key: ADMIN_MOBILE
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Portal Administrator
      - key: ALLOWED_ORIGINS
        value: ""
